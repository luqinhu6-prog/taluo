<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔罗健康占卜</title>
<style>
  :root {
    --bg: #0a0a16;
    --card-bg: #1a1035;
    --gold: #c9a95c;
    --gold-light: #e0c97f;
    --purple: #6b3fa0;
    --text: #d4d4e0;
    --accent: #7eb8da;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  #bgCanvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .container {
    position: relative; z-index: 1;
    max-width: 900px; margin: 0 auto; padding: 24px 16px 60px;
    display: flex; flex-direction: column; align-items: center;
  }

  /* Header */
  .header { text-align: center; margin: 20px 0 10px; }
  .header h1 {
    font-size: clamp(24px, 5vw, 40px);
    background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .subtitle {
    color: #8888aa; font-size: 14px; margin-top: 6px; letter-spacing: 2px;
  }
  .header .emoji-deco { font-size: 32px; display: block; margin-bottom: 4px;
    -webkit-text-fill-color: initial; }

  /* Spread selection */
  .spread-select { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin: 20px 0; }
  .spread-btn {
    padding: 12px 24px; border-radius: 50px; border: 1px solid var(--gold);
    background: transparent; color: var(--gold); cursor: pointer;
    font-size: 15px; letter-spacing: 1px;
    transition: all 0.3s; font-family: inherit;
  }
  .spread-btn:hover, .spread-btn.active {
    background: rgba(201, 169, 92, 0.15); box-shadow: 0 0 20px rgba(201, 169, 92, 0.2);
  }
  .spread-btn.active { border-color: var(--gold-light); }

  /* Card area */
  .card-area {
    display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
    margin: 24px 0; min-height: 280px; align-items: center;
  }

  /* 3D Card */
  .card-scene { width: 160px; height: 240px; perspective: 800px; }
  .card {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
    border-radius: 14px; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border: 2px solid var(--gold);
  }

  /* Card back */
  .card-back {
    background: linear-gradient(135deg, #1a1040, #2d1860, #1a1040);
    overflow: hidden;
  }
  .card-back::before {
    content: ''; position: absolute; inset: 8px; border-radius: 8px;
    border: 1px solid rgba(201, 169, 92, 0.4);
    background: repeating-conic-gradient(
      rgba(201, 169, 92, 0.08) 0% 5%, transparent 5% 10%
    ) 50%;
  }
  .card-back .star-icon {
    font-size: 48px; position: relative; z-index: 1; filter: drop-shadow(0 0 8px rgba(201,169,92,0.5));
  }
  .card-back .tap-hint {
    position: relative; z-index: 1; color: var(--gold); font-size: 12px;
    margin-top: 8px; letter-spacing: 1px; opacity: 0.7;
  }

  /* Card front */
  .card-front {
    background: linear-gradient(145deg, #150d30, #1f1340, #150d30);
    transform: rotateY(180deg); padding: 16px;
    justify-content: flex-start; gap: 8px;
  }
  .card-front .card-icon { font-size: 44px; margin-top: 8px; }
  .card-front .card-name {
    color: var(--gold); font-size: 18px; font-weight: bold; letter-spacing: 1px;
  }
  .card-front .card-name-en {
    color: #8888aa; font-size: 11px; letter-spacing: 1px;
  }
  .card-front .card-position {
    font-size: 11px; padding: 3px 10px; border-radius: 20px;
    margin-top: 4px; letter-spacing: 1px;
  }
  .card-front .pos-upright { background: rgba(126, 184, 218, 0.2); color: var(--accent); }
  .card-front .pos-reversed { background: rgba(220, 130, 130, 0.2); color: #dc8282; }

  /* Interpretation panel */
  .interpretation {
    display: none; max-width: 600px; width: 100%;
    background: rgba(26, 16, 53, 0.8); border: 1px solid rgba(201, 169, 92, 0.3);
    border-radius: 16px; padding: 24px; margin-top: 8px;
    animation: fadeIn 0.6s ease;
  }
  .interpretation.show { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .interp-title { color: var(--gold); font-size: 20px; margin-bottom: 6px; }
  .interp-subtitle { color: #8888aa; font-size: 12px; margin-bottom: 16px; }
  .interp-section { margin-bottom: 14px; }
  .interp-section h3 {
    color: var(--accent); font-size: 14px; margin-bottom: 4px; letter-spacing: 1px;
  }
  .interp-section p { color: #c0c0d0; font-size: 14px; line-height: 1.7; }
  .interp-tip {
    background: rgba(201, 169, 92, 0.1); border-left: 2px solid var(--gold);
    padding: 10px 14px; border-radius: 0 8px 8px 0; margin-top: 12px;
    font-size: 13px; color: var(--gold-light);
  }

  /* Actions */
  .actions { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn-primary {
    padding: 12px 28px; border-radius: 50px; border: none;
    background: linear-gradient(135deg, var(--purple), #8b5fc0);
    color: #fff; cursor: pointer; font-size: 15px; letter-spacing: 1px;
    font-family: inherit; transition: all 0.3s;
  }
  .btn-primary:hover { box-shadow: 0 0 24px rgba(107, 63, 160, 0.4); transform: translateY(-1px); }
  .btn-outline {
    padding: 12px 28px; border-radius: 50px; border: 1px solid var(--gold);
    background: transparent; color: var(--gold); cursor: pointer;
    font-size: 15px; letter-spacing: 1px; font-family: inherit; transition: all 0.3s;
  }
  .btn-outline:hover { background: rgba(201, 169, 92, 0.1); }

  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .card-scene { width: 120px; height: 180px; }
    .card-front .card-icon { font-size: 32px; }
    .card-front .card-name { font-size: 15px; }
    .card-area { gap: 12px; min-height: 220px; }
  }
</style>

// ==================== PARTICLE BACKGROUND ====================
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.5 + 0.5,
    vx: (Math.random() - 0.5) * 0.3,
    vy: -Math.random() * 0.4 - 0.1,
    alpha: Math.random() * 0.6 + 0.2
  });
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) { p.y = 0; p.x = Math.random() * canvas.width; }
    ctx.fillStyle = `rgba(201,169,92,${p.alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();

  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startDraw() {
  const shuffled = shuffleDeck();
  flippedCards = new Set();
  document.getElementById('interpretation').classList.remove('show');
  document.getElementById('interpretation').innerHTML = '';

  if (currentSpread === 'single') {
    drawnCards = [shuffled[0]];
    spreadLabel = '今日健康启示';
  } else if (currentSpread === 'three') {
    drawnCards = [shuffled[0], shuffled[1], shuffled[2]];
    spreadLabel = '过去 · 现在 · 未来';
  } else if (currentSpread === 'choice') {
    drawnCards = [shuffled[0], shuffled[1]];
    spreadLabel = '选项A  vs  选项B';
  }

  renderCards();
  document.getElementById('btnDraw').classList.add('hidden');
  document.getElementById('btnReset').classList.remove('hidden');
}

function renderCards() {
  const area = document.getElementById('cardArea');
  const labels = currentSpread === 'three' ? ['过去', '现在', '未来'] :
                 currentSpread === 'choice' ? ['选项A', '选项B'] : ['今日启示'];

  area.innerHTML = drawnCards.map((card, i) => {
    const isRev = Math.random() < 0.3; // 30% chance reversed
    card._reversed = isRev;
    return `
    <div class="card-scene" onclick="flipCard(${i})">
      <div class="card" id="card${i}">
        <div class="card-face card-back">
          <span class="star-icon">🔮</span>
          <span class="tap-hint">点击翻牌</span>
        </div>
        <div class="card-face card-front">
          <span class="card-icon">${card.icon}</span>
          <span class="card-name">${card.name}</span>
          <span class="card-name-en">${card.nameEn}</span>
          <span class="card-position ${isRev ? 'pos-reversed' : 'pos-upright'}">${isRev ? '逆位' : '正位'}</span>
        </div>
      </div>
      <div style="text-align:center;margin-top:8px;color:#8888aa;font-size:12px;letter-spacing:1px;">${labels[i] || ''}</div>
    </div>`;
  }).join('');
}

function flipCard(index) {
  if (flippedCards.has(index)) return;
  flippedCards.add(index);
  document.getElementById('card' + index).classList.add('flipped');

  // Show interpretation after short delay
  setTimeout(() => showInterpretation(), 400);

  // Check if all flipped
  if (flippedCards.size === drawnCards.length) {
    document.getElementById('btnReset').classList.remove('hidden');
  }
}

function showInterpretation() {
  const panel = document.getElementById('interpretation');
  const labels = currentSpread === 'three' ? ['过去', '现在', '未来'] :
                 currentSpread === 'choice' ? ['选项A', '选项B'] : ['今日启示'];

  let html = '';
  const flipped = [...flippedCards].sort();

  if (currentSpread === 'single' && flipped.length === 1) {
    const card = drawnCards[0];
    html = singleCardHTML(card, '');
  } else if (currentSpread === 'choice' && flipped.length === 2) {
    html = `
      <div class="interp-title">⚖️ 健康选择解读</div>
      <div class="interp-subtitle">两张牌分别对应你的两个选择</div>
      ${choiceCardHTML(drawnCards[0], '选项A')}
      ${choiceCardHTML(drawnCards[1], '选项B')}
    `;
  } else if (currentSpread === 'three') {
    html = `
      <div class="interp-title">🃏 三张牌解读</div>
      <div class="interp-subtitle">过去 · 现在 · 未来 —— 你的健康旅程</div>
      ${flipped.map(i => singleCardHTML(drawnCards[i], labels[i])).join('')}
    `;
  } else if (currentSpread === 'choice' && flipped.length === 1) {
    html = `<div class="interp-title">⚖️ 健康选择</div>
            <div class="interp-subtitle">再点击另一张牌查看完整解读</div>`;
  } else if (currentSpread === 'three' && flipped.length < 3) {
    html = `<div class="interp-title">🃏 三张牌占卜</div>
            <div class="interp-subtitle">继续点击剩余牌面查看完整解读（已揭示 ${flipped.length}/3）</div>
            ${flipped.map(i => singleCardHTML(drawnCards[i], labels[i])).join('')}`;
  }

  panel.innerHTML = html;
  panel.classList.add('show');
}

function singleCardHTML(card, label) {
  const isRev = card._reversed;
  return `
    <div class="interp-section">
      <h3>${label ? label + ' — ' : ''}${card.icon} ${card.name}（${isRev ? '逆位' : '正位'}）</h3>
      <p>${isRev ? card.reversed : card.upright}</p>
      <div class="interp-tip">💡 ${card.tip}</div>
    </div>
  `;
}

function choiceCardHTML(card, label) {
  const isRev = card._reversed;
  return `
    <div class="interp-section">
      <h3>${label}：${card.icon} ${card.name}（${isRev ? '逆位' : '正位'}）</h3>
      <p>${isRev ? card.reversed : card.upright}</p>
      <div class="interp-tip">💡 ${card.tip}</div>
    </div>
  `;
}

function resetAll() {
  drawnCards = [];
  flippedCards = new Set();
  document.getElementById('cardArea').innerHTML = '';
  document.getElementById('interpretation').classList.remove('show');
  document.getElementById('interpretation').innerHTML = '';
  document.getElementById('btnDraw').classList.remove('hidden');
  document.getElementById('btnReset').classList.add('hidden');
}

// Init
document.getElementById('btnDraw').classList.remove('hidden');
</script>
</body>
</html>
